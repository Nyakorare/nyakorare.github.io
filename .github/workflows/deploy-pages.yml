# Builds the Vite app and publishes `dist/` to GitHub Pages (free).
name: Deploy to GitHub Pages

on:
  push:
    # Deploy built `dist/` only from `main` (GitHub Pages environment is protected).
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep builds aligned with deployment branch.
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync docs/ from dist/
        run: node scripts/sync-docs.mjs

      - name: Commit and push docs/
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A docs
            git commit -m "Sync docs from dist [skip ci]"
            git push
          else
            echo "docs/ unchanged; nothing to push"
          fi
