<html lang="en" data-theme="portfolio">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var k = "portfolio-color-scheme";
          var t = localStorage.getItem(k);
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "portfolio");
          } else if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "portfolioDark");
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.setAttribute("data-theme", "portfolioDark");
          } else {
            document.documentElement.setAttribute("data-theme", "portfolio");
          }
        } catch (e) {}
      })();
    </script>
